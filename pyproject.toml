[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchforge"
version = "0.1.0"
description = "A statistically validated performance regression research platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "typer>=0.12",
    "rich>=13.9",
    "pydantic>=2.8",
    "ruptures>=1.1.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.110",
    "ruff>=0.7"
]

[project.scripts]
benchforge = "benchforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint.per-file-ignores]
"src/benchforge/cli.py" = ["B008"]
