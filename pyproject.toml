[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchforge"
version = "0.1.0"
description = "Reproducible systems benchmarking and performance regression analysis"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gavneet Singh" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
]
keywords = ["benchmarking", "performance", "statistics", "regression"]
urls = { Repository = "https://github.com/gavneet0030/BenchForge" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "typer>=0.12",
    "rich>=13.9",
    "pypdf>=5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.110",
    "ruff>=0.7",
    "httpx>=0.27,<1"
]
datasets = [
    "openpyxl>=3.1",
    "pyarrow>=18"
]
analytics = [
    "duckdb>=1.4,<2"
]
polars = [
    "polars>=1.35,<2"
]
dbt = [
    "dbt-duckdb>=1.9,<2"
]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1"
]

[project.scripts]
benchforge = "benchforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint.per-file-ignores]
"src/benchforge/cli.py" = ["B008"]
